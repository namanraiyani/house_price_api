# .github/workflows/ci.yml

name: Python CI-CD Pipeline

# 1. Trigger the pipeline on any push to the 'main' branch
on:
  push:
    branches: [ "main" ]

jobs:
  #####################
  #  CI: TEST JOB
  #####################
  test:
    name: Test and Lint
    runs-on: ubuntu-latest # Use a standard Linux runner

    steps:
      # --- Setup ---
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true # IMPORTANT: This tells the action to download your .pkl file

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt # Install app dependencies
          pip install pytest flake8       # Install testing dependencies

      # --- Running Tests ---
      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: |
          pytest

  #####################
  #  CD: BUILD & PUSH JOB
  #####################
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test # This job will ONLY run if the 'test' job succeeds

    # Grant permissions for this job to write to the GitHub Package Registry
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true # Need LFS again to get the .pkl file for the Docker build
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }} # Your GitHub username/org
          password: ${{ secrets.GITHUB_TOKEN }}  # A special token provided by GitHub Actions

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .       # Use the current directory as the build context
          push: true       # Push the image after building
          tags: ghcr.io/${{ github.repository }}:latest  # Tag image as 'latest'
          # e.g., ghcr.io/your-username/house_price_api:latest